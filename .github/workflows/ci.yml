name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f
        with:
          version: '0.10.16+b1a0e846e'
          core-version: '0.10.16+b1a0e846e'
      - run: moon fmt --check
      - run: moon check --target all --deny-warn
      - run: moon test --target js --deny-warn
      - run: moon test --target wasm-gc --deny-warn
      - run: moon build cmd/main --target js --deny-warn
      - run: moon run examples/library --target js
      - run: moon info --target js
      - run: git diff --exit-code -- "*.mbti"
      - run: python examples/repair_demo.py
      - run: python tests/stream_failures.py
      - name: Check directories, Unicode and bounded-memory large-file recovery
        run: python tests/reference_ci.py
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.os }}
          path: |
            _build/conformance.json
            _build/capacity.json
            _build/streaming.json
